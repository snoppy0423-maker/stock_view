<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>&#21363;&#26178;&#32929;&#20729;&#36861;&#36452;</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f1;
      --ink: #18211d;
      --muted: #66716b;
      --line: #d7ded7;
      --panel: #ffffff;
      --accent: #18745d;
      --soft: #eaf3ef;
      --danger: #b63131;
      --shadow: 0 14px 36px rgba(21, 35, 30, .10);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "Noto Sans TC", system-ui, sans-serif;
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(24, 116, 93, .12), transparent 34%),
        linear-gradient(315deg, rgba(198, 79, 50, .10), transparent 30%),
        var(--bg);
    }

    button, select { font: inherit; }

    .shell {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 30px 0 42px;
    }

    header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: end;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 4vw, 44px);
      line-height: 1.08;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 0;
      max-width: 820px;
      color: var(--muted);
      line-height: 1.6;
    }

    .status {
      min-width: 260px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, .78);
      color: var(--muted);
      text-align: right;
      box-shadow: var(--shadow);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      margin: 16px 0;
    }

    .toolbar-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    button {
      min-height: 44px;
      border: 0;
      border-radius: 7px;
      padding: 0 16px;
      cursor: pointer;
      color: #fff;
      background: var(--accent);
      transition: transform .14s ease, opacity .14s ease;
      white-space: nowrap;
    }

    button:hover { transform: translateY(-1px); }
    button:disabled { cursor: default; opacity: .55; transform: none; }

    button.secondary {
      color: var(--ink);
      border: 1px solid var(--line);
      background: #fff;
    }

    select {
      min-height: 44px;
      min-width: 140px;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 0 12px;
      color: var(--ink);
      background: #fff;
      outline: none;
    }

    select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(24, 116, 93, .16);
    }

    .interval {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .stock-card {
      min-height: 244px;
      display: grid;
      gap: 12px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, .94);
      box-shadow: var(--shadow);
    }

    .card-head {
      min-width: 0;
    }

    .symbol {
      margin: 0;
      font-size: 22px;
      letter-spacing: 0;
      overflow-wrap: anywhere;
    }

    .name {
      margin-top: 4px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.35;
      min-height: 20px;
      overflow-wrap: anywhere;
    }

    .price {
      font-size: 38px;
      line-height: 1;
      font-weight: 750;
      letter-spacing: 0;
      overflow-wrap: anywhere;
    }

    .meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .metric {
      min-width: 0;
      padding: 10px;
      border-radius: 7px;
      background: var(--soft);
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 4px;
    }

    .metric strong {
      font-size: 15px;
      overflow-wrap: anywhere;
    }

    .change.up { color: #087442; }
    .change.down { color: var(--danger); }

    .message {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      min-height: 38px;
    }

    @media (max-width: 880px) {
      header, .grid { grid-template-columns: 1fr; }
      .status { text-align: left; }
      .toolbar { align-items: stretch; }
      .toolbar > *, .interval { width: 100%; }
      .interval select { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <h1>&#21363;&#26178;&#32929;&#20729;&#36861;&#36452;</h1>
        <p class="subtitle">&#22266;&#23450;&#36861;&#36452;&#21488;&#32929;&#33287;&#32654;&#32929;&#28165;&#21934;&#65292;&#36039;&#26009;&#20358;&#28304;&#28858; Google &#36001;&#32147;&#12290;&#24050;&#31227;&#38500;&#26032;&#22686;&#32929;&#31080;&#33287;&#20282;&#26381;&#22120;&#28165;&#21934;&#21151;&#33021;&#65307;&#35201;&#22686;&#21152;&#27161;&#30340;&#26178;&#20877;&#30452;&#25509;&#26356;&#26032;&#31243;&#24335;&#28165;&#21934;&#12290;</p>
      </div>
      <div class="status" id="status">&#27491;&#22312;&#36617;&#20837;</div>
    </header>

    <div class="toolbar">
      <div class="toolbar-buttons">
        <button id="refreshButton" type="button">&#8635; &#31435;&#21363;&#26356;&#26032;</button>
        <button class="secondary" id="exportButton" type="button">&#21295;&#20986; Excel</button>
      </div>
      <label class="interval">
        &#33258;&#21205;&#26356;&#26032;
        <select id="intervalSelect">
          <option value="0">&#38364;&#38281;</option>
          <option value="10000">&#27599; 10 &#31186;</option>
          <option value="20000">&#27599; 20 &#31186;</option>
        </select>
      </label>
    </div>

    <section class="grid" id="stockGrid" aria-live="polite"></section>
  </main>

  <script>
    const TEXT = {
      updating: "\u66f4\u65b0\u4e2d...",
      lastUpdate: "\u4e0a\u6b21\u66f4\u65b0",
      loadingQuote: "\u66f4\u65b0\u4e2d",
      quote: "\u5373\u6642\u884c\u60c5",
      dash: "\u2014",
      marketTime: "\u884c\u60c5\u6642\u9593",
      change: "\u6f32\u8dcc",
      openClose: "\u958b\u76e4 / \u6628\u6536",
      highLow: "\u6700\u9ad8 / \u6700\u4f4e",
      sourceNote: "\u512a\u5148\u53d6 Google \u8ca1\u7d93\u9801\u9762\u9802\u90e8\u986f\u793a\u5831\u50f9",
      exportHeaders: ["\u6392\u5e8f", "\u4ee3\u865f", "\u540d\u7a31", "\u5e02\u5834", "\u8cc7\u6599\u4f86\u6e90", "\u50f9\u683c", "\u6f32\u8dcc", "\u6f32\u8dcc\u5e45", "\u884c\u60c5\u6642\u9593", "\u958b\u76e4", "\u6628\u6536", "\u6700\u9ad8", "\u6700\u4f4e", "\u6210\u4ea4\u91cf", "\u72c0\u614b"]
    };

    const intervalKey = "stock-tracker-interval-v5";
    const stocks = [
      { symbol: "00662", quote: null, error: "" },
      { symbol: "00646", quote: null, error: "" },
      { symbol: "0050", quote: null, error: "" },
      { symbol: "006208", quote: null, error: "" },
      { symbol: "00692", quote: null, error: "" },
      { symbol: "0056", quote: null, error: "" },
      { symbol: "00878", quote: null, error: "" },
      { symbol: "00850", quote: null, error: "" },
      { symbol: "00713", quote: null, error: "" },
      { symbol: "VT", quote: null, error: "" },
      { symbol: "VOO", quote: null, error: "" },
      { symbol: "VTI", quote: null, error: "" },
      { symbol: "BND", quote: null, error: "" }
    ];
    const state = { loading: false, timer: null };

    const $ = (selector) => document.querySelector(selector);
    const grid = $("#stockGrid");
    const status = $("#status");
    const intervalSelect = $("#intervalSelect");

    function apiPath(path) {
      return location.protocol === "file:" ? `http://127.0.0.1:8787${path}` : path;
    }

    function formatNumber(value, digits = 2) {
      if (value === null || value === undefined || Number.isNaN(Number(value))) return TEXT.dash;
      return new Intl.NumberFormat("zh-TW", {
        minimumFractionDigits: digits,
        maximumFractionDigits: digits
      }).format(Number(value));
    }

    async function getQuote(symbol) {
      const response = await fetch(apiPath(`/api/quote?symbol=${encodeURIComponent(symbol)}&t=${Date.now()}`), { cache: "no-store" });
      const payload = await response.json();
      if (!response.ok) throw new Error(payload.error || `HTTP ${response.status}`);
      return payload;
    }

    function render() {
      grid.innerHTML = stocks.map((stock, index) => {
        const quote = stock.quote;
        const changeClass = quote?.change > 0 ? "up" : quote?.change < 0 ? "down" : "";
        const sign = quote?.change > 0 ? "+" : "";
        const changeText = quote?.change === null || quote?.change === undefined
          ? TEXT.dash
          : `${sign}${formatNumber(quote.change)} (${sign}${formatNumber(quote.changePercent)}%)`;

        return `
          <article class="stock-card" data-symbol="${stock.symbol}">
            <div class="card-head">
              <h2 class="symbol">${index + 1}. ${stock.symbol}</h2>
              <div class="name">${quote?.displayName || TEXT.quote}</div>
            </div>
            <div class="price">${quote ? formatNumber(quote.price) : TEXT.loadingQuote}</div>
            <div class="meta">
              <div class="metric"><span>${TEXT.change}</span><strong class="change ${changeClass}">${changeText}</strong></div>
              <div class="metric"><span>${TEXT.marketTime}</span><strong>${quote?.quoteTime || TEXT.dash}</strong></div>
              <div class="metric"><span>${TEXT.openClose}</span><strong>${quote ? `${formatNumber(quote.open)} / ${formatNumber(quote.previousClose)}` : TEXT.dash}</strong></div>
              <div class="metric"><span>${TEXT.highLow}</span><strong>${quote ? `${formatNumber(quote.high)} / ${formatNumber(quote.low)}` : TEXT.dash}</strong></div>
            </div>
            <div class="message">${stock.error || quote?.note || TEXT.sourceNote}</div>
          </article>
        `;
      }).join("");
    }

    async function refreshAll() {
      if (state.loading) return;
      state.loading = true;
      status.textContent = TEXT.updating;
      render();

      await Promise.all(stocks.map(async (stock) => {
        try {
          stock.quote = await getQuote(stock.symbol);
          stock.error = "";
        } catch (error) {
          stock.error = error.message;
        }
      }));

      state.loading = false;
      status.textContent = `${TEXT.lastUpdate}: ${new Intl.DateTimeFormat("zh-TW", {
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      }).format(new Date())}`;
      render();
    }

    function setIntervalTimer() {
      if (state.timer) window.clearInterval(state.timer);
      const ms = Number(intervalSelect.value);
      localStorage.setItem(intervalKey, String(ms));
      if (ms > 0) state.timer = window.setInterval(refreshAll, ms);
    }

    function escapeCell(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function exportExcel() {
      const rows = stocks.map((stock, index) => {
        const quote = stock.quote || {};
        return [
          index + 1,
          stock.symbol,
          quote.displayName || "",
          quote.market || "",
          quote.provider || "",
          quote.price ?? "",
          quote.change ?? "",
          quote.changePercent ?? "",
          quote.quoteTime || "",
          quote.open ?? "",
          quote.previousClose ?? "",
          quote.high ?? "",
          quote.low ?? "",
          quote.volume ?? "",
          stock.error || "OK"
        ];
      });

      const table = [TEXT.exportHeaders, ...rows]
        .map((row) => `<tr>${row.map((cell) => `<td>${escapeCell(cell)}</td>`).join("")}</tr>`)
        .join("");
      const html = `<!doctype html><html><head><meta charset="utf-8"></head><body><table>${table}</table></body></html>`;
      const blob = new Blob([html], { type: "application/vnd.ms-excel;charset=utf-8" });
      const link = document.createElement("a");
      const date = new Date().toISOString().slice(0, 10);
      link.href = URL.createObjectURL(blob);
      link.download = `stock-tracker-${date}.xls`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(link.href);
    }

    $("#refreshButton").addEventListener("click", refreshAll);
    $("#exportButton").addEventListener("click", exportExcel);
    intervalSelect.value = localStorage.getItem(intervalKey) === "20000" ? "20000" : "10000";
    intervalSelect.addEventListener("change", setIntervalTimer);
    setIntervalTimer();
    render();
    refreshAll();
  </script>
</body>
</html>
