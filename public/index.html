<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>&#21363;&#26178;&#32929;&#20729;&#36861;&#36452;</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f1;
      --ink: #18211d;
      --muted: #66716b;
      --line: #d7ded7;
      --panel: #ffffff;
      --accent: #18745d;
      --soft: #eaf3ef;
      --danger: #b63131;
      --shadow: 0 14px 36px rgba(21, 35, 30, .10);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "Noto Sans TC", system-ui, sans-serif;
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(24, 116, 93, .12), transparent 34%),
        linear-gradient(315deg, rgba(198, 79, 50, .10), transparent 30%),
        var(--bg);
    }

    button, input { font: inherit; }

    .shell {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 30px 0 42px;
    }

    header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: end;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 4vw, 44px);
      line-height: 1.08;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 0;
      max-width: 820px;
      color: var(--muted);
      line-height: 1.6;
    }

    .status {
      min-width: 260px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, .78);
      color: var(--muted);
      text-align: right;
      box-shadow: var(--shadow);
    }

    .controls,
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      margin: 16px 0;
    }

    .controls {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .toolbar-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    button {
      min-height: 44px;
      border: 0;
      border-radius: 7px;
      padding: 0 16px;
      cursor: pointer;
      color: #fff;
      background: var(--accent);
      transition: transform .14s ease, opacity .14s ease;
      white-space: nowrap;
    }

    button:hover { transform: translateY(-1px); }
    button:disabled { cursor: default; opacity: .55; transform: none; }

    button.secondary {
      color: var(--ink);
      border: 1px solid var(--line);
      background: #fff;
    }

    button.danger {
      background: var(--danger);
    }

    input {
      min-height: 44px;
      flex: 1 1 360px;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 0 12px;
      color: var(--ink);
      background: #fff;
      outline: none;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(24, 116, 93, .16);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .stock-card {
      min-height: 244px;
      display: grid;
      gap: 12px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, .94);
      box-shadow: var(--shadow);
    }

    .card-head {
      min-width: 0;
    }

    .symbol {
      margin: 0;
      font-size: 22px;
      letter-spacing: 0;
      overflow-wrap: anywhere;
    }

    .symbol a {
      color: inherit;
      text-decoration: none;
    }

    .symbol a:hover {
      color: var(--accent);
      text-decoration: underline;
    }

    .name {
      margin-top: 4px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.35;
      min-height: 20px;
      overflow-wrap: anywhere;
    }

    .price {
      font-size: 38px;
      line-height: 1;
      font-weight: 750;
      letter-spacing: 0;
      overflow-wrap: anywhere;
    }

    .meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .metric {
      min-width: 0;
      padding: 10px;
      border-radius: 7px;
      background: var(--soft);
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 4px;
    }

    .metric strong {
      font-size: 15px;
      overflow-wrap: anywhere;
    }

    .change.up { color: #087442; }
    .change.down { color: var(--danger); }

    .message {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      min-height: 38px;
    }

    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 10;
      max-width: min(520px, calc(100vw - 36px));
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      box-shadow: var(--shadow);
      line-height: 1.45;
    }

    .toast[hidden] {
      display: none;
    }

    @media (max-width: 880px) {
      header, .grid { grid-template-columns: 1fr; }
      .status { text-align: left; }
      .toolbar { align-items: stretch; }
      .toolbar > *, .controls > * { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <h1>&#21363;&#26178;&#32929;&#20729;&#36861;&#36452;</h1>
        <p class="subtitle">&#22266;&#23450;&#36861;&#36452;&#21488;&#32929;&#33287;&#32654;&#32929;&#28165;&#21934;&#65292;&#36039;&#26009;&#20358;&#28304;&#28858; Google &#36001;&#32147;&#12290;&#21487;&#29992;&#36887;&#34399;&#19968;&#27425;&#26032;&#22686;&#22810;&#31558;&#27161;&#30340;&#65292;&#26032;&#22686;&#38917;&#30446;&#26371;&#25509;&#22312;&#21407;&#26412; 13 &#27284;&#24460;&#38754;&#12290;</p>
      </div>
      <div class="status" id="status">&#27491;&#22312;&#36617;&#20837;</div>
    </header>

    <form class="controls" id="addForm">
      <input id="symbolInput" name="symbol" autocomplete="off" placeholder="&#36664;&#20837;&#32929;&#31080;&#20195;&#34399;&#65292;&#20363;&#22914; AAPL, MSFT, 2330&#65292;&#21487;&#26032;&#22686;&#25110;&#21034;&#38500;">
      <button type="submit">&#65291; &#26032;&#22686;</button>
      <button class="danger" id="deleteButton" type="button">&#21034;&#38500;</button>
    </form>

    <div class="toolbar">
      <div class="toolbar-buttons">
        <button id="refreshButton" type="button">&#8635; &#31435;&#21363;&#26356;&#26032;</button>
        <button class="secondary" id="exportButton" type="button">&#21295;&#20986; Excel</button>
      </div>
    </div>

    <section class="grid" id="stockGrid" aria-live="polite"></section>
    <div class="toast" id="toast" hidden></div>
  </main>

  <script>
    const TEXT = {
      updating: "\u66f4\u65b0\u4e2d...",
      lastUpdate: "\u4e0a\u6b21\u66f4\u65b0",
      loadingQuote: "\u66f4\u65b0\u4e2d",
      quote: "\u5373\u6642\u884c\u60c5",
      dash: "\u2014",
      marketTime: "\u884c\u60c5\u6642\u9593",
      change: "\u6f32\u8dcc",
      sourceNote: "\u512a\u5148\u53d6 Google \u8ca1\u7d93\u9801\u9762\u9802\u90e8\u986f\u793a\u5831\u50f9",
      noDeleteTarget: "\u7121\u6307\u5b9a\u80a1\u7968\u80fd\u522a\u9664",
      deletedLabel: "\u5df2\u522a\u9664\u7684\u80a1\u7968\u4ee3\u78bc",
      notFoundLabel: "\u4e0d\u80fd\u522a\u9664\u7684\u80a1\u7968\u4ee3\u78bc",
      exportHeaders: ["\u6392\u5e8f", "\u4ee3\u865f", "\u540d\u7a31", "\u5e02\u5834", "\u8cc7\u6599\u4f86\u6e90", "\u50f9\u683c", "\u6f32\u8dcc", "\u6f32\u8dcc\u5e45", "\u884c\u60c5\u6642\u9593", "\u6210\u4ea4\u91cf", "\u72c0\u614b"]
    };

    const customStorageKey = "stock-tracker-custom-symbols-v1";
    const removedDefaultStorageKey = "stock-tracker-removed-default-symbols-v1";
    const defaultSymbols = [
      "00662",
      "00646",
      "0050",
      "006208",
      "00692",
      "0056",
      "00878",
      "00850",
      "00713",
      "VT",
      "VOO",
      "VTI",
      "BND"
    ];
    const defaultSymbolSet = new Set(defaultSymbols);
    const stocks = [];
    const state = { loading: false, toastTimer: null };

    const $ = (selector) => document.querySelector(selector);
    const grid = $("#stockGrid");
    const status = $("#status");
    const toast = $("#toast");

    function apiPath(path) {
      return location.protocol === "file:" ? `http://127.0.0.1:8787${path}` : path;
    }

    function formatNumber(value, digits = 2) {
      if (value === null || value === undefined || Number.isNaN(Number(value))) return TEXT.dash;
      return new Intl.NumberFormat("zh-TW", {
        minimumFractionDigits: digits,
        maximumFractionDigits: digits
      }).format(Number(value));
    }

    async function getQuote(symbol) {
      const response = await fetch(apiPath(`/api/quote?symbol=${encodeURIComponent(symbol)}&t=${Date.now()}`), { cache: "no-store" });
      const payload = await response.json();
      if (!response.ok) throw new Error(payload.error || `HTTP ${response.status}`);
      return payload;
    }

    function normalizeSymbol(raw) {
      return String(raw || "").trim().toUpperCase().replace(/[^A-Z0-9.-]/g, "");
    }

    function readCustomSymbols() {
      try {
        return JSON.parse(localStorage.getItem(customStorageKey) || "[]");
      } catch {
        return [];
      }
    }

    function readRemovedDefaultSymbols() {
      try {
        return JSON.parse(localStorage.getItem(removedDefaultStorageKey) || "[]");
      } catch {
        return [];
      }
    }

    function writeRemovedDefaultSymbols(symbols) {
      localStorage.setItem(removedDefaultStorageKey, JSON.stringify([...new Set(symbols)]));
    }

    function showToast(message) {
      if (state.toastTimer) window.clearTimeout(state.toastTimer);
      toast.textContent = message;
      toast.hidden = false;
      state.toastTimer = window.setTimeout(() => {
        toast.hidden = true;
      }, 5000);
    }

    function parseSymbols(raw) {
      return [...new Set(String(raw || "")
        .split(",")
        .map(normalizeSymbol)
        .filter(Boolean))];
    }

    function loadStoredSymbols() {
      const removed = new Set(readRemovedDefaultSymbols());
      const symbols = [
        ...defaultSymbols.filter((symbol) => !removed.has(symbol)),
        ...readCustomSymbols()
      ];
      const seen = new Set();
      stocks.splice(0, stocks.length);
      for (const symbol of symbols) {
        if (seen.has(symbol)) continue;
        stocks.push({ symbol, quote: null, error: "" });
        seen.add(symbol);
      }
    }

    function saveCustomSymbols() {
      const customSymbols = stocks
        .map((stock) => stock.symbol)
        .filter((symbol) => !defaultSymbolSet.has(symbol));
      localStorage.setItem(customStorageKey, JSON.stringify(customSymbols));
    }

    function addSymbols(raw) {
      const symbols = parseSymbols(raw);
      const existing = new Set(stocks.map((stock) => stock.symbol));
      const removed = new Set(readRemovedDefaultSymbols());
      let added = false;

      for (const symbol of symbols) {
        if (existing.has(symbol)) continue;
        stocks.push({ symbol, quote: null, error: "" });
        existing.add(symbol);
        removed.delete(symbol);
        added = true;
      }

      writeRemovedDefaultSymbols([...removed]);
      if (added) saveCustomSymbols();
      return added;
    }

    function deleteSymbols(raw) {
      const symbols = parseSymbols(raw);
      const deleted = [];
      const missing = [];
      const removed = new Set(readRemovedDefaultSymbols());

      for (const symbol of symbols) {
        const index = stocks.findIndex((stock) => stock.symbol === symbol);
        if (index < 0) {
          missing.push(symbol);
          continue;
        }
        stocks.splice(index, 1);
        if (defaultSymbolSet.has(symbol)) removed.add(symbol);
        deleted.push(symbol);
      }

      if (!deleted.length) {
        showToast(TEXT.noDeleteTarget);
      } else if (missing.length) {
        showToast(`${TEXT.deletedLabel}: ${deleted.join(", ")}; ${TEXT.notFoundLabel}: ${missing.join(", ")}`);
      } else {
        showToast(`${TEXT.deletedLabel}: ${deleted.join(", ")}`);
      }

      writeRemovedDefaultSymbols([...removed]);
      saveCustomSymbols();
      render();
    }

    function googleFinanceUrl(stock) {
      const exchange = stock.quote?.exchange || (/^\d{4,6}[A-Z]?$/.test(stock.symbol) ? "TPE" : "");
      if (exchange) {
        return `https://www.google.com/finance/beta/quote/${encodeURIComponent(stock.symbol)}:${exchange}?hl=zh-TW`;
      }
      return `https://www.google.com/finance/beta/search?q=${encodeURIComponent(stock.symbol)}&hl=zh-TW`;
    }

    function render() {
      grid.innerHTML = stocks.map((stock, index) => {
        const quote = stock.quote;
        const changeClass = quote?.change > 0 ? "up" : quote?.change < 0 ? "down" : "";
        const sign = quote?.change > 0 ? "+" : "";
        const changeText = quote?.change === null || quote?.change === undefined
          ? TEXT.dash
          : `${sign}${formatNumber(quote.change)} (${sign}${formatNumber(quote.changePercent)}%)`;

        return `
          <article class="stock-card" data-symbol="${stock.symbol}">
            <div class="card-head">
              <h2 class="symbol"><a href="${googleFinanceUrl(stock)}" target="_blank" rel="noopener noreferrer">${stock.symbol}</a></h2>
              <div class="name">${quote?.displayName || TEXT.quote}</div>
            </div>
            <div class="price">${quote ? formatNumber(quote.price) : TEXT.loadingQuote}</div>
            <div class="meta">
              <div class="metric"><span>${TEXT.change}</span><strong class="change ${changeClass}">${changeText}</strong></div>
              <div class="metric"><span>${TEXT.marketTime}</span><strong>${quote?.quoteTime || TEXT.dash}</strong></div>
            </div>
            <div class="message">${stock.error || quote?.note || TEXT.sourceNote}</div>
          </article>
        `;
      }).join("");
    }

    async function refreshAll() {
      if (state.loading) return;
      state.loading = true;
      status.textContent = TEXT.updating;
      render();

      await Promise.all(stocks.map(async (stock) => {
        try {
          stock.quote = await getQuote(stock.symbol);
          stock.error = "";
        } catch (error) {
          stock.error = error.message;
        }
      }));

      state.loading = false;
      status.textContent = `${TEXT.lastUpdate}: ${new Intl.DateTimeFormat("zh-TW", {
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      }).format(new Date())}`;
      render();
    }

    function escapeCell(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function exportExcel() {
      const rows = stocks.map((stock, index) => {
        const quote = stock.quote || {};
        return [
          index + 1,
          stock.symbol,
          quote.displayName || "",
          quote.market || "",
          quote.provider || "",
          quote.price ?? "",
          quote.change ?? "",
          quote.changePercent ?? "",
          quote.quoteTime || "",
          quote.volume ?? "",
          stock.error || "OK"
        ];
      });

      const table = [TEXT.exportHeaders, ...rows]
        .map((row) => `<tr>${row.map((cell) => `<td>${escapeCell(cell)}</td>`).join("")}</tr>`)
        .join("");
      const html = `<!doctype html><html><head><meta charset="utf-8"></head><body><table>${table}</table></body></html>`;
      const blob = new Blob([html], { type: "application/vnd.ms-excel;charset=utf-8" });
      const link = document.createElement("a");
      const date = new Date().toISOString().slice(0, 10);
      link.href = URL.createObjectURL(blob);
      link.download = `stock-tracker-${date}.xls`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(link.href);
    }

    $("#refreshButton").addEventListener("click", refreshAll);
    $("#exportButton").addEventListener("click", exportExcel);
    $("#addForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const input = $("#symbolInput");
      if (addSymbols(input.value)) {
        input.value = "";
        render();
        await refreshAll();
      }
    });
    $("#deleteButton").addEventListener("click", () => {
      const input = $("#symbolInput");
      deleteSymbols(input.value);
      input.value = "";
    });
    loadStoredSymbols();
    render();
    refreshAll();
  </script>
</body>
</html>
